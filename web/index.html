<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It's Just a While Loop</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #FAFAF8; --ink: #14161A; --text: #3A3F45; --muted: #6E757E; --faint: #9AA1AA;
    --accent: #D24A1E; --tint: #FBEAE3; --line: #E4E4DF; --code-size: 16px;
    --sans: "Space Grotesk", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; padding: 28px 40px 14px; gap: 20px; }
  button { font: inherit; cursor: pointer; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
  .kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  h1 { font-size: 44px; margin: 6px 0 6px; font-weight: 600; letter-spacing: -.015em; }
  .blurb { color: var(--muted); font-size: 18px; margin: 0; max-width: 62ch; }
  nav { display: flex; gap: 8px; flex-shrink: 0; }
  nav button { font-family: var(--mono); font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--muted); padding: 10px 16px; border-radius: 999px; transition: all .15s; }
  nav button:hover { border-color: var(--faint); color: var(--ink); }
  nav button .n { color: var(--faint); margin-right: 8px; }
  nav button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  nav button.active .n { color: var(--accent); }
  nav button .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 8px; vertical-align: middle; visibility: hidden; animation: pulse 1s infinite; }
  nav button.running .dot { visibility: visible; }
  @keyframes pulse { 50% { opacity: .25; } }

  main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; min-height: 0; transition: grid-template-columns .25s; }
  main.wide { grid-template-columns: minmax(0, .7fr) minmax(0, 1.6fr); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card-head { font-family: var(--mono); font-size: 12px; color: var(--muted); padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .card-head b { color: var(--ink); font-weight: 500; text-transform: none; letter-spacing: 0; }

  .code { overflow: auto; flex: 1; font-family: var(--mono); font-size: var(--code-size); line-height: 1.55; padding: 12px 0; margin: 0; color: var(--text); }
  .code .ln { display: block; white-space: pre; padding-right: 18px; }
  .code .no { display: inline-block; width: 3.4em; text-align: right; padding-right: 1.2em; color: #C6CACE; user-select: none; }
  .code .ln.focus { background: var(--tint); box-shadow: inset 3px 0 var(--accent); }
  .code .ln.focus .no { color: var(--accent); }
  .tk-c { color: var(--faint); font-style: italic; }
  .tk-s { color: #B03E17; }
  .tk-k { color: var(--ink); font-weight: 600; }
  .tk-n { color: #0097A7; }

  .side { display: grid; grid-template-rows: auto minmax(0, 2fr) auto minmax(0, 1fr); gap: 14px; min-height: 0; }
  main.wide .side { grid-template-rows: auto minmax(0, 1fr) auto; }
  main.wide .playground { display: none; }
  body:has(main.wide) h1 { font-size: 30px; margin: 4px 0 0; }
  body:has(main.wide) .blurb { display: none; }
  main.wide .watch { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 10px 16px; }
  main.wide .watch .label { margin: 0; }
  main.wide .watch .item { font-size: 14px; }
  .controls { display: flex; gap: 8px; }
  .controls input { flex: 1; min-width: 0; font-family: var(--mono); font-size: 14px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); }
  .controls input:disabled { color: var(--muted); background: #F3F3F0; }
  .controls input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .btn { border-radius: 8px; padding: 10px 16px; font-family: var(--mono); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .btn.run { background: var(--accent); color: #fff; border: 0; min-width: 96px; }
  .btn.run.stop { background: var(--ink); }
  .btn.ghost { background: #fff; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }
  .btn.ghost:hover { color: var(--ink); border-color: var(--faint); }

  .term { background: var(--ink); border-color: var(--ink); }
  .term .card-head { border-color: #2A2D33; color: var(--faint); }
  .term .card-head b { color: #fff; }
  .term pre { flex: 1; overflow: auto; margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: 14px; line-height: 1.5; color: #E6E6E3; white-space: pre-wrap; word-break: break-word; }
  .term .empty { color: #6E757E; }
  .a1 { font-weight: 700; color: #fff; }
  .a2 { opacity: .5; }
  .a32 { color: #7FD48A; }
  .a33 { color: #FFAB40; }
  .a36 { color: #5FC4D4; }
  .a91 { color: #FF8A80; }
  .term .card-head .tools { display: flex; gap: 14px; align-items: center; }
  .term .card-head button { background: none; border: 1px solid #3A3E45; color: var(--faint); border-radius: 6px; padding: 2px 8px; font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .term .card-head button:hover { color: #fff; border-color: var(--faint); }

  .watch { display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; }
  .watch .label { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 2px; }
  .watch .item { display: flex; align-items: center; gap: 10px; font-size: 16px; color: var(--faint); transition: color .2s; }
  .watch .item .tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex-shrink: 0; display: grid; place-items: center; font-size: 11px; color: #fff; transition: all .2s; }
  .watch .item.hit { color: var(--ink); }
  .watch .item.hit .tick { background: var(--accent); border-color: var(--accent); }

  .files { flex: 1; overflow: auto; padding: 4px 0; }
  .files .empty { color: var(--faint); font-family: var(--mono); font-size: 13px; padding: 12px 16px; }
  .file { padding: 8px 16px; border-bottom: 1px solid var(--line); }
  .file:last-child { border-bottom: 0; }
  .file .name { font-family: var(--mono); font-size: 13px; color: var(--accent); font-weight: 600; }
  .file .name span { color: var(--faint); font-weight: 400; }
  .file pre { margin: 6px 0 0; font-family: var(--mono); font-size: 13px; color: var(--text); white-space: pre-wrap; max-height: 180px; overflow: auto; }
  .file.new { animation: flash 1.2s; }
  @keyframes flash { from { background: var(--tint); } }

  footer { font-family: var(--mono); font-size: 12px; color: var(--faint); display: flex; justify-content: space-between; }
  kbd { font-family: var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: #fff; color: var(--muted); }
</style>
</head>
<body>
  <header>
    <div>
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
      <p class="blurb" id="blurb"></p>
    </div>
    <nav id="tabs"></nav>
  </header>

  <main>
    <section class="card">
      <div class="card-head"><b id="file"></b><span id="lines"></span></div>
      <pre class="code" id="code"></pre>
    </section>

    <section class="side">
      <div class="controls">
        <input id="task" spellcheck="false">
        <button class="btn run" id="run">▶ Run</button>
        <button class="btn ghost" id="reset" title="Delete ./playground">Reset</button>
      </div>

      <div class="card term">
        <div class="card-head"><span>Output</span><span class="tools"><b id="status">idle</b><button id="widen" title="Give the output the whole right side (O)">Wide</button></span></div>
        <pre id="out"></pre>
      </div>

      <div class="card watch" id="watch"></div>

      <div class="card playground">
        <div class="card-head"><span>./playground</span><span>on disk</span></div>
        <div class="files" id="files"></div>
      </div>
    </section>
  </main>

  <footer>
    <span><kbd>←</kbd> <kbd>→</kbd> steps &nbsp; <kbd>1</kbd>–<kbd>4</kbd> jump &nbsp; <kbd>Enter</kbd> run / stop &nbsp; <kbd>R</kbd> reset playground &nbsp; <kbd>O</kbd> wide output &nbsp; <kbd>+</kbd> <kbd>−</kbd> code size</span>
    <span>IOWA CODE CAMP 2026 · IT'S JUST A WHILE LOOP</span>
  </footer>

<script>
const PROMPT = "make me a hello world in TypeScript";

// focus: ranges to highlight. [from, to] spans the first line containing `from` to the next line
// containing `to` ("}" means a bare "}" line). A single [text] marks every line containing it.
const STEPS = [
  {
    tab: "Model", kicker: "02 / How it works · slide 11", title: "Start with the model",
    blurb: "Text in, text out. On its own it cannot touch your computer.",
    focus: [["const res = await fetch", "console.log(JSON.stringify"]],
    watch: [["The reply is plain text", /"type": "text"/], ["Nothing gets written to disk", "exit"]],
  },
  {
    tab: "Listener", kicker: "02 / How it works · slide 12", title: "Add something that listens",
    blurb: "Send a tool schema. The reply comes back with a structured tool_use block. Noticing it is our job.",
    focus: [["// The listener", "}"]],
    watch: [["A tool_use block comes back", /tool call!/], ["The model did not run anything", "exit"]],
  },
  {
    tab: "Tools", kicker: "02 / How it works · slide 13", title: "Add the tools",
    blurb: "Three ordinary functions. The listener matches the name and runs the right one.",
    focus: [["for (const block of reply.content)", "}"]],
    watch: [["The listener runs write_file", /tool_result/], ["Then it stops. The model never hears back", "exit"]],
  },
  {
    tab: "Loop", kicker: "03 / Build the simplest version · slides 19–20", title: "Send the result back. Go again.",
    blurb: "One while loop, one if statement, three functions.",
    focus: [["while (true)"], ["// 0"], ["await fetch(URL"], ["messages.push"], ["if (calls.length"]], task: true,
    watch: [
      ["The tool call shows up in the model output", /tool_use/],
      ["The tool result gets appended to the list", /tool_result/],
      ["The model decides it is finished and stops", /loop stops/],
    ],
  },
];

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const stripAnsi = (s) => s.replace(/\x1b\[[\d;]*m/g, "");

// Each step keeps its own run, so switching tabs mid-run doesn't lose anything.
const state = STEPS.map(() => ({ source: null, out: "", status: "idle", es: null, started: 0 }));
let cur = Math.max(0, Math.min(STEPS.length - 1, Number(location.hash.slice(1)) - 1 || 0));
let codeSize = Number(localStorage.codeSize) || 16;

// ── Code ─────────────────────────────────────────────────────────────────────
const TOKENS = /(\/\/.*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|\b(const|let|await|import|from|for|of|while|if|else|return|try|catch|type|true|false|break)\b|\b(\d[\d_]*)\b/g;

function highlight(line) {
  let html = "", last = 0;
  for (const m of line.matchAll(TOKENS)) {
    html += esc(line.slice(last, m.index));
    const cls = m[1] ? "c" : m[2] ? "s" : m[3] ? "k" : "n";
    html += `<span class="tk-${cls}">${esc(m[0])}</span>`;
    last = m.index + m[0].length;
  }
  return html + esc(line.slice(last));
}

function renderCode() {
  const { source } = state[cur];
  const step = STEPS[cur];
  if (source === null) return;
  const lines = source.replace(/\n$/, "").split("\n");
  const focused = new Set();
  for (const [from, to] of step.focus) {
    const start = lines.findIndex((l) => l.includes(from));
    const end = to ? lines.findIndex((l, i) => i > start && (to === "}" ? l === "}" : l.includes(to))) : -1;
    lines.forEach((l, i) => (to ? i >= start && i <= end : l.includes(from)) && focused.add(i));
  }
  $("code").innerHTML = lines
    .map((l, i) => `<span class="ln${focused.has(i) ? " focus" : ""}"><span class="no">${i + 1}</span>${highlight(l)}</span>`)
    .join("");
  $("lines").textContent = `${lines.length} lines`;
  const first = $("code").children[Math.min(...focused)];
  if (first) $("code").scrollTop = first.offsetTop - $("code").offsetTop - 40;
}

async function loadSource(i) {
  if (state[i].source !== null) return;
  const res = await fetch(`/api/source/${i + 1}`);
  const { file, source } = await res.json();
  Object.assign(state[i], { file, source });
}

// ── Output ───────────────────────────────────────────────────────────────────
function ansi(s) {
  let html = "";
  const cls = new Set();
  s.split(/\x1b\[([\d;]*)m/).forEach((part, i) => {
    if (i % 2) {
      for (const code of part.split(";")) code === "" || code === "0" ? cls.clear() : cls.add("a" + code);
    } else if (part) {
      html += cls.size ? `<span class="${[...cls].join(" ")}">${esc(part)}</span>` : esc(part);
    }
  });
  return html;
}

function renderOut() {
  const s = state[cur];
  const pre = $("out");
  pre.innerHTML = s.out ? ansi(s.out) : `<span class="empty">Press Enter or ▶ Run to execute ${esc(s.file ?? "")}</span>`;
  pre.scrollTop = pre.scrollHeight;
  renderStatus();
  renderWatch();
}

function renderStatus() {
  const s = state[cur];
  const secs = ((Date.now() - s.started) / 1000).toFixed(1);
  $("status").textContent = s.es ? `running · ${secs}s` : s.status;
  $("run").textContent = s.es ? "■ Stop" : "▶ Run";
  $("run").classList.toggle("stop", !!s.es);
  [...$("tabs").children].forEach((b, i) => b.classList.toggle("running", !!state[i].es));
}
setInterval(() => state[cur].es && renderStatus(), 100);

function renderWatch() {
  const s = state[cur];
  const text = stripAnsi(s.out);
  const exited = s.status.startsWith("exit");
  $("watch").innerHTML =
    `<div class="label">Watch for</div>` +
    STEPS[cur].watch
      .map(([label, when]) => {
        const hit = when === "exit" ? exited : when.test(text);
        return `<div class="item${hit ? " hit" : ""}"><span class="tick">${hit ? "✓" : ""}</span>${esc(label)}</div>`;
      })
      .join("");
}

// ── Running ──────────────────────────────────────────────────────────────────
function run() {
  const i = cur;
  const s = state[i];
  if (s.es) return stop(i);
  const task = STEPS[i].task ? $("task").value.trim() : "";
  const qs = task && task !== PROMPT ? `?task=${encodeURIComponent(task)}` : "";
  Object.assign(s, { out: "", status: "running", started: Date.now() });
  s.es = new EventSource(`/api/run/${i + 1}${qs}`);
  s.es.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === "out") s.out += msg.text;
    if (msg.type === "err") s.out += `\x1b[91m${msg.text}\x1b[0m`;
    if (msg.type === "exit") {
      s.es.close();
      s.es = null;
      s.status = `exit ${msg.code}`;
    }
    if (i === cur) renderOut();
    refreshFiles();
  };
  // EventSource reconnects on its own; never let it re-run a step.
  s.es.onerror = () => {
    s.es?.close();
    s.es = null;
    s.status = "disconnected";
    if (i === cur) renderOut();
  };
  renderOut();
}

function stop(i = cur) {
  const s = state[i];
  if (!s.es) return;
  s.es.close();
  s.es = null;
  s.status = "stopped";
  if (i === cur) renderOut();
  refreshFiles();
}

// ── Playground ───────────────────────────────────────────────────────────────
let known = new Map();
let refreshTimer;
function refreshFiles() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(async () => {
    const files = await (await fetch("/api/playground")).json();
    $("files").innerHTML = files.length
      ? files
          .map(({ name, content }) => {
            const isNew = refreshFiles.ready && known.get(name) !== content;
            return `<div class="file${isNew ? " new" : ""}"><div class="name">${esc(name)} <span>${new Blob([content]).size} bytes</span></div><pre>${esc(content)}</pre></div>`;
          })
          .join("")
      : `<div class="empty">empty. nothing on disk yet.</div>`;
    known = new Map(files.map((f) => [f.name, f.content]));
    refreshFiles.ready = true;
  }, 150);
}

async function reset() {
  await fetch("/api/reset", { method: "POST" });
  state[cur].out = "";
  state[cur].status = "idle";
  renderOut();
  refreshFiles();
}

// ── Navigation ───────────────────────────────────────────────────────────────
async function show(i) {
  cur = (i + STEPS.length) % STEPS.length;
  history.replaceState(null, "", `#${cur + 1}`);
  const step = STEPS[cur];
  $("kicker").textContent = step.kicker;
  $("title").textContent = step.title;
  $("blurb").textContent = step.blurb;
  [...$("tabs").children].forEach((b, j) => b.classList.toggle("active", j === cur));
  const task = $("task");
  task.disabled = !step.task;
  task.title = step.task ? "Type your own task, then Enter" : "This step has the prompt hardcoded";
  if (!step.task) task.value = PROMPT;
  else if (!task.dataset.custom) task.value = PROMPT;
  await loadSource(cur);
  $("file").textContent = state[cur].file;
  renderCode();
  renderOut();
}

$("tabs").innerHTML = STEPS.map((s, i) => `<button data-i="${i}"><span class="n">0${i + 1}</span>${s.tab}<span class="dot"></span></button>`).join("");
$("tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (b) show(Number(b.dataset.i));
});
$("run").addEventListener("click", () => run());
$("reset").addEventListener("click", () => reset());
$("widen").addEventListener("click", () => widen());
$("task").addEventListener("input", (e) => (e.target.dataset.custom = "1"));
// Keep keyboard shortcuts working after a click.
document.addEventListener("click", (e) => e.target.closest("button")?.blur());

function widen() {
  const wide = document.querySelector("main").classList.toggle("wide");
  $("widen").textContent = wide ? "Narrow" : "Wide";
  setTimeout(renderCode, 260);
}

function zoom(delta) {
  codeSize = Math.max(11, Math.min(28, codeSize + delta));
  localStorage.codeSize = codeSize;
  document.documentElement.style.setProperty("--code-size", `${codeSize}px`);
}

addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.tagName === "INPUT") {
    if (e.key === "Enter") { e.preventDefault(); run(); e.target.blur(); }
    if (e.key === "Escape") e.target.blur();
    return;
  }
  const k = e.key;
  if (k === "ArrowRight" || k === "ArrowDown") show(cur + 1);
  else if (k === "ArrowLeft" || k === "ArrowUp") show(cur - 1);
  else if (/^[1-9]$/.test(k) && Number(k) <= STEPS.length) show(Number(k) - 1);
  else if (k === "Enter" || k === " ") run();
  else if (k === "Escape") stop();
  else if (k === "r" || k === "R") reset();
  else if (k === "o" || k === "O") widen();
  else if (k === "=" || k === "+") zoom(1);
  else if (k === "-" || k === "_") zoom(-1);
  else if (k === "t" && STEPS[cur].task) $("task").focus();
  else return;
  e.preventDefault();
});

zoom(0);
show(cur);
refreshFiles();
</script>
</body>
</html>
